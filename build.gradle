plugins {
    id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

// --- Multi-version dev profile selector (-Pmc=26.1 | 1.21.11 | 1.21.4 | 1.21.1 | 1.20.4 | 1.20.1) ---
def mcTarget = (project.findProperty('mc') ?: '26.1').toString()
def mcVersions = [
    '26.1': [
        minecraft: '26.1',
        fabricApi: '0.145.1+26.1',
        bbs      : '2.1-26.1',
        sodium   : 'mc26.1.1-0.8.9-fabric',
        iris     : '1.10.9+26.1-fabric',
        calEditor: '1.2.1-26.1',
        glsl     : '3.0.0-pre3',
        lwjglPin : null,
    ],
    '1.21.11': [
        minecraft: '1.21.11',
        fabricApi: '0.141.6+1.21.11',
        bbs      : '2.1-1.21.11',
        sodium   : 'mc1.21.11-0.8.12-fabric',
        iris     : '1.10.7+1.21.11-fabric',
        calEditor: '1.2.1-1.21.11',
        glsl     : '3.0.0-pre3',
        lwjglPin : null,
    ],
    '1.21.4': [
        minecraft: '1.21.4',
        fabricApi: '0.118.0+1.21.4',
        bbs      : '2.1-1.21.4',
        sodium   : 'mc1.21.4-0.6.13-fabric',
        iris     : '1.8.8+1.21.4-fabric',
        calEditor: '1.2.1-1.21.4',
        lwjglPin : null,
    ],
    '1.21.1': [
        minecraft: '1.21.1',
        fabricApi: '0.116.12+1.21.1',
        bbs      : '2.1-1.21.1',
        sodium   : 'mc1.21.1-0.6.13-fabric',
        iris     : '1.8.8+1.21.1-fabric',
        calEditor: '1.2.1-1.21.1',
        lwjglPin : null,
    ],
    '1.20.1': [
        minecraft: '1.20.1',
        fabricApi: '0.92.9+1.20.1',
        bbs      : '2.1-1.20.1',
        sodium   : 'mc1.20.1-0.5.11',
        iris     : '1.7.2+1.20.1',
        calEditor: '1.2.1-1.20.1',
        lwjglPin : '3.3.1',
    ],
    '1.20.4': [
        minecraft: '1.20.4',
        fabricApi: '0.91.1+1.20.4',
        bbs      : '2.1-1.20.4',
        sodium   : 'mc1.20.4-0.5.8',
        iris     : '1.7.2+1.20.4',
        calEditor: '1.2.1-1.20.4',
        lwjglPin : null,
    ],
]
if (!mcVersions.containsKey(mcTarget)) {
    throw new GradleException("Unknown -Pmc=${mcTarget}; expected 26.1, 1.21.11, 1.21.4, 1.21.1, 1.20.4 or 1.20.1")
}
def V = mcVersions[mcTarget]
logger.lifecycle("IRLite build target: Minecraft ${V.minecraft} (Mojang mappings)")

def irlCoreVersion = project.hasProperty("irl_core_version") ? project.property("irl_core_version") : "1.1.5"
def irlCoreJar = "irl-core-${irlCoreVersion}-${V.minecraft}.jar"

version = "${project.mod_version}+mc${V.minecraft}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "irlite" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    runs {
        client {
            if (project.hasProperty('quickplay')) {
                programArgs '--quickPlaySingleplayer', project.property('quickplay').toString()
            }
            if (project.hasProperty('clientJvmArgs')) {
                project.property('clientJvmArgs').toString().split(/\s+/).findAll { !it.isEmpty() }.each { vmArg it }
            }
        }
    }
}

fabricApi {
    configureDataGeneration {
        client = true
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }

    flatDir {
        dirs 'libs'
    }
    // glsl-transformer (io.github.douira), an Iris runtime dependency.
    maven { url = "https://maven.gegy.dev/" }
    // irl-core (shared engine) is published here by `gradlew publishToMavenLocal`
    // in ../irl-core — must be resolvable before this mod builds.
    mavenLocal()
    mavenCentral()
}

if (V.lwjglPin != null) {
    configurations.all {
        resolutionStrategy.eachDependency { details ->
            if (details.requested.group == "org.lwjgl") {
                details.useVersion V.lwjglPin
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${V.minecraft}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${V.fabricApi}"

    // --- Shared BBS-free engine: light SSBO + .irlights patcher (irl-core) ---
    implementation files("libs/${irlCoreJar}")

    // Iris & Sodium
    implementation "maven.modrinth:iris:${V.iris}"
    implementation "maven.modrinth:sodium:${V.sodium}"

    if (file("libs/bbs-cml-${V.bbs}.jar").exists()) {
        implementation files("libs/bbs-cml-${V.bbs}.jar")
    } else {
        implementation "maven.modrinth:bbs-cml-edition:${V.bbs}"
    }

    if (V.calEditor != null) {
        implementation "maven.modrinth:irl-cal-editor:${V.calEditor}"
    }

    // Iris runtime dependencies
    implementation "org.anarres:jcpp:1.4.14"
    implementation "io.github.douira:glsl-transformer:${V.glsl ?: '3.0.0-pre3'}"
}

processResources {
    def replaceProperties = [
        "version": project.version,
        "minecraft_version": project.minecraft_version,
        "loader_version": project.loader_version,
        "irl_core_jar": irlCoreJar
    ]

    inputs.properties replaceProperties

    filesMatching("fabric.mod.json") {
        expand replaceProperties
    }

    // Embed the canonical .irlights (source of truth = patches/) so BbsPatcherHost
    // auto-extracts them on first use (matches the redactor's bundled model).
    from("patches") { into "assets/irlite/patches" }
}

def targetJavaVersion = (mcTarget == '26.1' || mcTarget == '26.2') ? 25 : ((mcTarget == '1.21.11' || mcTarget == '1.21.4' || mcTarget == '1.21.1') ? 21 : 17)
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(targetJavaVersion)
    targetCompatibility = JavaVersion.toVersion(targetJavaVersion)
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }

    from("libs/${irlCoreJar}") {
        into "META-INF/jars"
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
